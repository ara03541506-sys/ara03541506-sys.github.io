<a class="series-card series-card--{{ include.direction }}" href="{{ include.article.url | relative_url }}">
  {% if include.article.image %}
    <img class="series-card__image" src="{{ include.article.image | relative_url }}" alt="" loading="lazy" width="1536" height="1024">
  {% endif %}
  <div class="series-card__body">
    <span class="series-card__label">{{ include.label }}</span>
    <h2>{{ include.article.title | escape }}</h2>
    <p>{{ include.article.description | escape }}</p>
  </div>
</a>
